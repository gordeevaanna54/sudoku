<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku – Peli</title>
    <link rel="stylesheet" href="peli.css">
</head>
<body>

<header class="header">
    <nav class="navbar">
        <div class="nav-brand">Sudoku</div>
        <div class="nav-right">
            <span class="nav-user" id="nav-username"></span>
            <button class="btn-logout" onclick="logout()">Kirjaudu ulos</button>
        </div>
    </nav>
</header>

<div class="game-wrap">

    <div class="top-row">
        <div>
            <div class="timer" id="timer-disp">00:00</div>
        </div>
        <div style="text-align:right">
            <div style="font-size:13px;color:rgba(232,196,196,.7)" id="disp-name"></div>
            <div class="record-label" id="disp-record"></div>
        </div>
    </div>

    <div class="diff-row">
        <button class="btn-diff active" onclick="setDiff(this,35)">Helppo</button>
        <button class="btn-diff"        onclick="setDiff(this,45)">Keskitaso</button>
        <button class="btn-diff"        onclick="setDiff(this,55)">Vaikea</button>
    </div>

    <div id="grid-wrap">
        <table class="sudoku" id="sudoku-table"></table>
    </div>

    <div class="numpad" id="numpad"></div>

    <div class="bottom-row">
        <button class="btn-new" onclick="startNewGame()">Uusi peli</button>
        <span class="mistakes-label">Virheet: <span class="mistakes-count" id="mistakes-disp">0</span>/3</span>
    </div>

</div>

<!-- WIN -->
<div id="win-overlay">
    <div class="win-card">
        <div style="font-size:48px"></div>
        <div class="win-title">Ratkaistu!</div>
        <div class="win-sub"  id="win-time-disp"></div>
        <div class="win-rec"  id="win-rec-disp"></div>
        <button class="btn-new" style="margin-top:10px" onclick="closeWin()">Pelaa uudelleen</button>
    </div>
</div>
<script src="peli.js"></script>
</body>
</html>
