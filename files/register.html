<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header class="header">
        <h1>Rekisteröidy nyt!</h1>
        <nav class="navbar">
            <div class="nav-brand">Muistipeli</div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Etusivu</a></li>
                <li><a href="register.html" class="nav-link active">Rekisteröidy</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="form-card">
            <h2>Luo tili</h2>
            <form id="registerForm">
                <div class="field">
                    <label>Käyttäjänimi</label>
                    <input type="text" placeholder="Valitse käyttäjänimi">
                </div>
                <div class="field">
                    <label>Sähköposti</label>
                    <input type="email" placeholder="sinun@email.fi">
                </div>
                <div class="field">
                    <label>Salasana</label>
                    <input type="password" placeholder="Luo salasana">
                </div>
                <div class="field">
                    <label>Toista salasana</label>
                    <input type="password" placeholder="Toista salasana">
                </div>
                <button type="submit" class="btn-submit">Rekisteröidy</button>
            </form>
            <p class="success-msg" id="successMsg">✅ Rekisteröinti onnistui!</p>
            <p class="login-hint">Onko sinulla jo tili? <a href="index.html">Kirjaudu sisään</a></p>
        </div>
    </main>

    <script src="register.js"></script>
</body>
</html>
